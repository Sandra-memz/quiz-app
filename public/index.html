<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font: inherit; }
    button { margin-top: 20px; padding: 10px 18px; font: inherit; cursor: pointer; }
    #result { margin-top: 24px; font-size: 1.2rem; }
  </style>
</head>
<body>
  <h1>Create a quiz</h1>

  <label>Unit name</label>
  <input id="unit" placeholder="e.g. Operating Systems" />

  <label>Topics (separate with commas)</label>
  <input id="topics" placeholder="e.g. Deadlocks, CPU scheduling" />

  <label>Or paste your lecture notes</label>
  <textarea id="notes" rows="8" placeholder="Paste notes here (optional)"></textarea>

  <label>Number of questions</label>
  <select id="count">
    <option value="auto">Let the system decide (recommended)</option>
    <option value="5">5</option>
    <option value="10">10</option>
    <option value="15">15</option>
    <option value="20">20</option>
    <option value="25">25</option>
  </select>

  <button id="createBtn">Generate quiz</button>
  <div id="result"></div>

  <script>
    const btn = document.getElementById("createBtn");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      const unit = document.getElementById("unit").value.trim();
      const topics = document.getElementById("topics").value
        .split(",").map((t) => t.trim()).filter(Boolean);
      const notes = document.getElementById("notes").value.trim();
      const count = document.getElementById("count").value;

      if (!notes && topics.length === 0) {
        result.textContent = "Add some topics or paste your notes first.";
        return;
      }

      btn.disabled = true;
      result.textContent = "Generating your quiz... this can take 10 to 20 seconds.";

      try {
        const res = await fetch("/quizzes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ unit, topics, notes, count }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong");
                const link = location.origin + "/take.html?code=" + data.code;
        result.innerHTML = "";
        result.appendChild(document.createTextNode("Your quiz code: " + data.code));
        const linkLine = document.createElement("div");
        const a = document.createElement("a");
        a.href = link;
        a.textContent = link;
        linkLine.appendChild(document.createTextNode("Share this link: "));
        linkLine.appendChild(a);
        result.appendChild(linkLine);
                const msg = "Take my quiz on " + (unit || "our unit") + "! Open this link and enter your name: " + link;
        const wa = document.createElement("a");
        wa.href = "https://wa.me/?text=" + encodeURIComponent(msg);
        wa.target = "_blank";
        wa.rel = "noopener";
        wa.textContent = "Invite a friend on WhatsApp";
        wa.style.display = "block";
        wa.style.marginTop = "12px";
        result.appendChild(wa);

        const copyBtn = document.createElement("button");
        copyBtn.textContent = "Copy link";
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(link);
            copyBtn.textContent = "Copied!";
          } catch (e) {
            copyBtn.textContent = "Copy failed, copy the link above";
          }
        });
        result.appendChild(copyBtn);
      } catch (err) {
        result.textContent = "Error: " + err.message;
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
