<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoreboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font: inherit; }
    button { margin-top: 16px; padding: 10px 18px; font: inherit; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #8884; }
    .muted { opacity: 0.7; font-size: 0.9rem; margin-top: 12px; }
  </style>
</head>
<body>
    <nav style="margin-bottom: 20px; display: flex; gap: 16px; flex-wrap: wrap;">
    <a href="/">Create a quiz</a>
    <a href="/take.html">Take a quiz</a>
    <a href="/results.html">Scoreboard</a>
  </nav>
  <h1>Scoreboard</h1>

  <label>Quiz code</label>
  <input id="code" placeholder="e.g. QUIZ-4821" />
  <button id="loadBtn">Show scores</button>

  <h2 id="title"></h2>
  <div id="board"></div>
  <div id="message" class="muted"></div>

  <script>
    const codeInput = document.getElementById("code");
    const title = document.getElementById("title");
    const board = document.getElementById("board");
    const message = document.getElementById("message");
    let timer = null;

    document.getElementById("loadBtn").addEventListener("click", () => loadBoard(false));

    const urlCode = new URLSearchParams(location.search).get("code");
    if (urlCode) {
      codeInput.value = urlCode;
      loadBoard(false);
    }

    async function loadBoard(silent) {
      const code = codeInput.value.trim().toUpperCase();
      if (!code) {
        message.textContent = "Enter a quiz code.";
        return;
      }
      if (!silent) message.textContent = "Loading...";

      try {
        const [quizRes, resultsRes] = await Promise.all([
          fetch("/quizzes/" + code),
          fetch("/quizzes/" + code + "/results"),
        ]);
        const quiz = await quizRes.json();
        if (!quizRes.ok) throw new Error(quiz.error || "Quiz not found");
        const data = await resultsRes.json();

        title.textContent = (quiz.unit || "Quiz") + " (" + code + ")";
        board.innerHTML = "";

        if (data.results.length === 0) {
          message.textContent = "Nobody has finished this quiz yet. This page refreshes every 20 seconds.";
        } else {
          const table = document.createElement("table");
          const head = document.createElement("tr");
          ["#", "Name", "Score", "Finished"].forEach((h) => {
            const th = document.createElement("th");
            th.textContent = h;
            head.appendChild(th);
          });
          table.appendChild(head);

          data.results.forEach((r, i) => {
            const tr = document.createElement("tr");
            [
              i + 1,
              r.playerName,
              r.score + " / " + r.total,
              new Date(r.submittedAt).toLocaleString(),
            ].forEach((v) => {
              const td = document.createElement("td");
              td.textContent = v;
              tr.appendChild(td);
            });
            table.appendChild(tr);
          });
          board.appendChild(table);
          message.textContent = "Updated " + new Date().toLocaleTimeString() + ". This page refreshes every 20 seconds.";
        }

        clearInterval(timer);
        timer = setInterval(() => loadBoard(true), 20000);
      } catch (err) {
        message.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
